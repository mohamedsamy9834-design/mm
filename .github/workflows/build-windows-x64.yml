name: Build MadaHost for Windows 7 x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.8.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -r requirements-win7.txt
          python -m pip install pyinstaller==5.13.2

      - name: Build standalone EXE
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MadaHost --add-data "web;web" --collect-all aiohttp --collect-all mss host\mada_host.py

      - name: Package output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\MadaHost.exe package\
          Copy-Item README.md package\
          Compress-Archive -Path package\* -DestinationPath MadaHost-Win7-x64.zip -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadaHost-Win7-x64
          path: MadaHost-Win7-x64.zip
          if-no-files-found: error
